
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="Play Project EAGLE, a browser-based voxel game.">
  <title>Project EAGLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #0b1018;
      color: #f3f6fb;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(
        ellipse at top,
        #182538 0%,
        #0b1018 58%
      );
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px clamp(14px, 3vw, 32px);
      border-bottom: 1px solid #263344;
      background: #090e16;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #111827;
      font-size: 23px;
      font-weight: 950;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .13em;
    }

    .subtitle {
      margin-top: 3px;
      color: #9eacbf;
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button, .open-link {
      border: 1px solid #35445a;
      background: #151f2d;
      color: #f3f6fb;
      padding: 9px 12px;
      border-radius: 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, .open-link:hover {
      background: #26364c;
    }

    button:focus-visible, .open-link:focus-visible {
      outline: 2px solid #f59e0b;
      outline-offset: 3px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: clamp(10px, 2vw, 20px);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #aebbd0;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 12px #f59e0b55;
    }

    .game-wrap {
      position: relative;
      flex: 1;
      min-height: 65vh;
      min-height: 65dvh;
      overflow: hidden;
      border: 1px solid #29384c;
      border-radius: 14px;
      background: #070b11;
      box-shadow: 0 20px 70px #0005;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 65vh;
      min-height: 65dvh;
      border: 0;
      background: #070b11;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background: #0b1018;
      transition: opacity .25s ease;
    }

    #loading h2 {
      margin: 0;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: .12em;
    }

    #loading p {
      max-width: 400px;
      margin: 0;
      color: #aebbd0;
      line-height: 1.6;
      font-size: 14px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #344258;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      padding: 0 20px 14px;
      text-align: center;
      color: #73839a;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: flex-start;
      }

      .game-wrap, iframe {
        min-height: 68vh;
        min-height: 68dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">E</div>
      <div>
        <h1>PROJECT EAGLE</h1>
        <div class="subtitle">
          Browser voxel game · Multiplayer test
        </div>
      </div>
    </div>

    <nav class="actions" aria-label="Game controls">
      <button id="reload" type="button">↻ Reload</button>
      <button id="fullscreen" type="button">⛶ Fullscreen</button>

      <a
        class="open-link"
        href="https://warner-freeware-rewards-complete.trycloudflare.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open game ↗
      </a>
    </nav>
  </header>

  <main>
    <div class="status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Connecting to Project EAGLE…</span>
    </div>

    <section class="game-wrap" id="game-wrap"
      aria-label="Project EAGLE game">

      <div id="loading">
        <div class="spinner" aria-hidden="true"></div>
        <h2>PROJECT EAGLE</h2>
        <p id="loading-message">
          Connecting to the game server. This may take a moment.
        </p>
      </div>

      <iframe
        id="game"
        src="https://ride-receiver-essentially-achieved.trycloudflare.com/"
        title="Project EAGLE game"
        allow="fullscreen; gamepad; autoplay"
        allowfullscreen
      ></iframe>
    </section>
  </main>

  <footer>
    Vega and the Cloudflare tunnel must remain running while playing.
  </footer>

  <script>
    const GAME_URL =
      "https://ride-receiver-essentially-achieved.trycloudflare.com/";

    const game = document.getElementById("game");
    const loading = document.getElementById("loading");
    const message = document.getElementById("loading-message");
    const status = document.getElementById("status-text");
    const reloadButton = document.getElementById("reload");
    const fullscreenButton = document.getElementById("fullscreen");
    const gameWrap = document.getElementById("game-wrap");

    let loadTimer;
    let hideTimer;

    function showLoading() {
      clearTimeout(loadTimer);
      clearTimeout(hideTimer);

      loading.style.display = "grid";
      loading.style.opacity = "1";

      message.textContent =
        "Connecting to the game server. This may take a moment.";

      status.textContent = "Connecting to Project EAGLE…";

      loadTimer = setTimeout(() => {
        status.textContent = "Still waiting for the game server…";
        message.textContent =
          "Check that Vega is running and the Cloudflare tunnel is active. " +
          "You can also open the game directly in a new tab.";
      }, 12000);
    }

    game.addEventListener("load", () => {
      clearTimeout(loadTimer);

      status.textContent = "Game page loaded";

      loading.style.opacity = "0";

      hideTimer = setTimeout(() => {
        loading.style.display = "none";
      }, 260);
    });

    reloadButton.addEventListener("click", () => {
      showLoading();

      // Cache-bust the request so the browser reloads the game page.
      game.src = GAME_URL + "?refresh=" + Date.now();
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await gameWrap.requestFullscreen();
        }
      } catch (error) {
        status.textContent =
          "Fullscreen unavailable. Try the browser's fullscreen option.";
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent = document.fullscreenElement
        ? "✕ Exit fullscreen"
        : "⛶ Fullscreen";
    });

    showLoading();
  </script>
</body>
</html>
