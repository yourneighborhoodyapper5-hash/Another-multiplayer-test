const REACH = 5, AUTOSAVE_S = 15, BENCH_SECONDS = 30;

// Compatibility renderer for browsers without WebGL2 (e.g. restricted console web viewers).
// This is intentionally a lightweight top-down view, not the full first-person 3D renderer.
class CanvasFallbackRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    if (!this.ctx) throw new Error('Canvas 2D is not available in this browser.');
    this.gpuBytes = 0;
    this.stats = { draws: 0, drawSum: 0, tris: 0, chunksDrawn: 0, chunksCulled: 0, w: 0, h: 0 };
    this.onRestore = null;
    this._lastWorld = null;
  }
  setAtlas(_atlas) {}
  uploadChunk(_chunk, _mesh) {}
  freeChunk(chunk) { if (chunk && chunk.gpu) chunk.gpu = null; }
  resize(cssW, cssH, dpr, dprCap, scale) {
    const k = Math.min(dpr || 1, dprCap || 1) * (scale || 1);
    const w = Math.max(2, Math.floor(cssW * k));
    const h = Math.max(2, Math.floor(cssH * k));
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w; this.canvas.height = h;
    }
    this.stats.w = w; this.stats.h = h;
  }
  render(f) {
    const ctx = this.ctx, canvas = this.canvas, world = f.world;
    const W = canvas.width, H = canvas.height;
    const sky = f.sky || [0.35, 0.55, 0.75];
    ctx.fillStyle = `rgb(${Math.round(sky[0]*255)},${Math.round(sky[1]*255)},${Math.round(sky[2]*255)})`;
    ctx.fillRect(0, 0, W, H);
    if (!world || typeof world.getBlock !== 'function') {
      ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
      ctx.fillText('EAGLE Canvas fallback: waiting for world…', 16, 28); return;
    }
    const px = f.eye[0], pz = f.eye[2];
    const span = Math.max(8, Math.min(18, (f.rd || 3) * 4));
    const cell = Math.max(3, Math.floor(Math.min(W, H) / (span * 2 + 3)));
    const ox = Math.floor(W / 2), oy = Math.floor(H / 2);
    const bx = Math.floor(px), bz = Math.floor(pz);
    const Bx = (typeof B !== 'undefined') ? B : {};
    const colors = new Map([
      [Bx.GRASS, '#65a34b'], [Bx.DIRT, '#795536'], [Bx.STONE, '#858585'],
      [Bx.SAND, '#d8c58a'], [Bx.WATER, '#397ec5'], [Bx.LOG, '#79502b'],
      [Bx.LEAVES, '#367d39'], [Bx.SNOW, '#e8f2f7'], [Bx.BEDROCK, '#343434'],
      [Bx.COAL_ORE, '#55534f'], [Bx.IRON_ORE, '#b6a18b'], [Bx.GRAVEL, '#9c9a92']
    ]);
    const topBlock = (x, z) => {
      for (let y = 127; y >= 0; y--) {
        const id = world.getBlock(x, y, z);
        if (id !== Bx.AIR && id !== undefined) return id;
      }
      return Bx.AIR;
    };
    const t0 = performance.now();
    for (let dz = -span; dz <= span; dz++) {
      for (let dx = -span; dx <= span; dx++) {
        const id = topBlock(bx + dx, bz + dz);
        ctx.fillStyle = colors.get(id) || '#555b60';
        ctx.fillRect(ox + dx * cell - cell/2, oy + dz * cell - cell/2, cell, cell);
      }
    }
    // Player marker and facing direction.
    ctx.fillStyle = '#f8f8f8'; ctx.beginPath(); ctx.arc(ox, oy, Math.max(3, cell*0.28), 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#202020'; ctx.lineWidth = Math.max(2, cell*0.12);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox - Math.sin(f.yaw || 0)*cell*1.4, oy - Math.cos(f.yaw || 0)*cell*1.4); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(8, 8, Math.min(W-16, 310), 42);
    ctx.fillStyle = '#fff'; ctx.font = `${Math.max(12, Math.floor(cell*0.8))}px sans-serif`;
    ctx.fillText('EAGLE · Canvas compatibility mode', 16, 25);
    ctx.fillText(`x ${Math.floor(px)}  z ${Math.floor(pz)} · top-down view`, 16, 42);
    this.stats.draws = 1; this.stats.tris = 0; this.stats.chunksDrawn = 0; this.stats.chunksCulled = 0;
    this.stats.drawSum = (this.stats.drawSum || 0) + (performance.now() - t0);
  }
}

class Game {
  /** env: {canvas, uiRoot, touchRoot, workerSource} */
  constructor(env) {
    this.env = env;
    this.settings = this._loadSettings();
    this.state = 'init';
    this.stats = new FrameStats(1800);
    this.errors = [];
    this.world = null; this.player = new Player(); this.inv = new Inventory();
    this.gameMode = 'survival'; this.craftingTableOpen = false;
    this.drops = new DropManager(); this.mobs = new MobManager();
    this.time = DAY_SECONDS * 0.3; this.day = dayState(this.time);
    this.target = null; this.breaking = null; this.breakCd = 0; this.attackCd = 0; this.breakSoundT = 0;
    this.last = 0; this.saveT = 0; this.dbgT = 0; this.lastDebug = '';
    this.adaptive = new AdaptiveQuality(this);
    this.bench = null; this.benchRec = null;
    this.loadingSince = 0;
    this.mp = null; this.mpToken = 0; this.mpMeta = null; this.mpUrl = ''; this.mpPending = []; this._applyingRemote = false;
    window.addEventListener('error', (e) => this._err(e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => this._err(e.reason));
  }

  _err(e) { const m = String((e && e.stack) || e).split('\n').slice(0, 2).join(' | '); this.errors.push(m); if (this.errors.length > 5) this.errors.shift(); console.error('[eagle]', e); }

  _loadSettings() {
    let s = {};
    try { s = JSON.parse(localStorage.getItem('eagle.settings') || '{}'); } catch (e) { /* ignore */ }
    const out = { ...DEFAULT_SETTINGS, ...s };
    const coarse = typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches;
    if (coarse && !s.renderDistance) { out.renderDistance = 5; out.quality = 'medium'; }
    return out;
  }
  _saveSettings() { try { localStorage.setItem('eagle.settings', JSON.stringify(this.settings)); } catch (e) { /* ignore */ } }

  // ---------------------------------------------------------------- init
  async init() {
    const { canvas, uiRoot, touchRoot } = this.env;
    this.input = new Input(canvas, touchRoot, this.settings);
    this.audio = new Audio(); this.audio.volume = this.settings.volume;
    this.ui = new UI(uiRoot, this);
    let gfxError = null;
    try {
      try { this.renderer = new Renderer(canvas); } catch (webglError) { console.warn('[eagle] WebGL2 unavailable; using Canvas 2D top-down fallback:', webglError.message); this.renderer = new CanvasFallbackRenderer(canvas); }
      this.atlas = buildAtlas(); this.renderer.setAtlas(this.atlas); this.ui.setAtlas(this.atlas);
      this.renderer.onRestore = () => location.reload();
    } catch (e) { gfxError = e.message; this._err(e); }

    await this._initStore();
    document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement !== canvas && this.state === 'play' && !this._touchMode()) this.pause(); });
    canvas.addEventListener('click', () => { this.audio.unlock(); if (this.state === 'play' && !this._touchMode() && document.pointerLockElement !== canvas) this.input.lockPointer(); });
    document.addEventListener('pointerdown', () => this.audio.unlock(), { once: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (this.state === 'play') this.pause(); else this.saveNow(); } });
    window.addEventListener('pagehide', () => this.saveNow());
    window.addEventListener('resize', () => this.ui.screen === 'inventory' && this.ui.renderInventory());

    this.setDebugVisible(this.settings.debug);
    this.showMenu(gfxError);
    this.last = performance.now();
    requestAnimationFrame((t) => this._frame(t));
    if (!gfxError && /[?&]bench(=|&|$)/.test(location.search)) this.startBenchmark();
  }

  async _initStore() {
    this.persistWarning = null;
    let backend;
    try { if (typeof indexedDB === 'undefined') throw new Error('no indexedDB'); backend = new IdbBackend(); await backend.getAll('worlds'); }
    catch (e) { backend = new MemoryBackend(); this.persistWarning = 'Browser storage is unavailable (private mode?). Worlds will not be saved.'; }
    this.store = new WorldStore(backend);
  }

  _touchMode() {
    const m = this.settings.touchMode;
    if (m === 'on') return true; if (m === 'off') return false;
    return typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches;
  }

  // ---------------------------------------------------------------- menus
  async showMenu(error) {
    this._mpLeave();
    await this._teardown();
    this.state = 'menu'; this.input.active = false; this.input.setTouchVisible(false); this.input.unlockPointer();
    let worlds = [];
    try { worlds = await this.store.listWorlds(); } catch (e) { error = error || 'Could not read saved worlds: ' + e.message; }
    this.ui.showMainMenu(worlds, error || this.persistWarning);
  }
  async createWorld(name, seedText, mode = 'survival') {
    if (!this.renderer) return;
    const safeMode = mode === 'creative' ? 'creative' : 'survival';
    const meta = await this.store.createWorld({ name, seed: parseSeed(seedText), mode: safeMode });
    this.playWorld(meta);
  }
  async deleteWorld(id) { await this.store.deleteWorld(id); this.showMenu(); }

  async _teardown() {
    if (!this.world) return;
    try { await this.saveNow(); } catch (e) { this._err(e); }
    this.world.dispose(); this.world = null;
  }

  // ---------------------------------------------------------------- world lifecycle
  async playWorld(meta, opts = {}) {
    if (!this.renderer) return;
    this.state = 'loading'; this.input.active = false; this.ui.showLoading('Preparing world…');
    await this._teardown();
    this.meta = meta;
    // Shared worlds are always Survival, regardless of the last local world played.
    this.gameMode = opts.multiplayer ? 'survival' : (meta.mode === 'creative' ? 'creative' : 'survival');
    this.craftingTableOpen = false;
    const nW = clamp((navigator.hardwareConcurrency || 4) - 2, 1, 3);
    const jobs = createJobs(this.env.workerSource, nW);
    const net = opts.multiplayer && this.mp ? this.mp.net : null;   // shared world: chunk diffs come from the server
    this.world = new World({ seed: meta.seed, wid: meta.id, jobs, store: net || (opts.ephemeral ? null : this.store), netDiffs: !!net, renderDistance: this.adaptive.renderDistance, ao: this.settings.quality !== 'low' });
    this.world.hooks.mesh = (c, m) => this.renderer.uploadChunk(c, m);
    this.world.hooks.free = (c) => this.renderer.freeChunk(c);
    if (net) this.world.hooks.edit = (edit) => { if (!this._applyingRemote && this.mp) this.mp.sendEdit(edit); };
    this.mpPending = [];
    this.drops = new DropManager(); this.mobs = new MobManager(); this.player = new Player(); this.inv = new Inventory();
    this.time = DAY_SECONDS * 0.3; this.breaking = null; this.target = null;
    const spawn = findSpawn(meta.seed); this.spawn = spawn;
    let saved = null;
    if (!opts.ephemeral) { try { saved = await this.store.loadPlayer(meta.id); } catch (e) { /* ignore */ } }
    this.needSpawnY = true;
    Object.assign(this.player, { x: spawn.x, y: spawn.y, z: spawn.z });
    if (net) this.time = this.mp.worldTime();
    if (saved) {
      this.player.restore(saved); this.inv = Inventory.deserialize(saved.inv);
      if (Number.isFinite(saved.time) && !net) this.time = saved.time;
      if (saved.spawn && Number.isFinite(saved.spawn.x)) this.spawn = saved.spawn;
      this.needSpawnY = !Number.isFinite(saved.y);
    }
    if (this.gameMode === 'creative') {
      // Ensure saved Creative worlds retain a usable block/tool supply.
      for (let id = 1; id < 100; id++) {
        if (isPlaceable(id) && this.inv.count(id) === 0) this.inv.add(id, 64);
      }
      for (let id = 110; id <= 118; id++) {
        if (this.inv.count(id) === 0) this.inv.add(id, 1);
      }
    }
    this.loadingSince = performance.now();
    this.state = opts.bench ? 'bench-load' : 'loading';
  }

  _loadingReady() {
    const p = this.player, pcx = Math.floor(p.x / CS), pcz = Math.floor(p.z / CS);
    let ok = 0, total = 0;
    for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) { total++; const c = this.world.chunkAt(pcx + dx, pcz + dz); if (c && c.hasMesh) ok++; }
    this.ui.showLoading(`Generating terrain… ${ok}/${total}`);
    return ok === total;
  }

  _enterPlay() {
    const p = this.player;
    if (this.needSpawnY) { const y = this.world.surfaceY(Math.floor(p.x), Math.floor(p.z)); p.y = y > 0 ? y + 0.01 : CH - 4; p.vy = 0; }
    this.ui.hideScreens(); this.state = 'play'; this.input.active = true; this.input.reset();
    this.input.setTouchVisible(this._touchMode());
    if (!this._touchMode()) this.input.lockPointer();
    this.saveT = 0;
  }

  pause() {
    if (this.state !== 'play') return;
    this.state = 'paused'; this.input.reset(); this.input.setTouchVisible(false); this.input.unlockPointer();
    this.ui.showPause(); this.saveNow();
  }
  resume() { this.ui.hideScreens(); this.state = 'play'; this.input.reset(); this.input.setTouchVisible(this._touchMode()); if (!this._touchMode()) this.input.lockPointer(); }
  quitToMenu() { this.showMenu(); }
  respawn() { this.player.respawn(this.spawn); this.needSpawnY = true; const y = this.world.surfaceY(Math.floor(this.spawn.x), Math.floor(this.spawn.z)); if (y > 0) this.player.y = y + 0.01; this.ui.hideScreens(); this.state = 'play'; this.input.setTouchVisible(this._touchMode()); if (!this._touchMode()) this.input.lockPointer(); }

  openInventory(craftingTable = false) {
    if (this.state !== 'play') return;
    this.craftingTableOpen = !!craftingTable;
    this.state = 'inventory'; this.input.reset(); this.input.setTouchVisible(false); this.input.unlockPointer(); this.ui.showInventory();
  }
  closeInventory() {
    if (this.state !== 'inventory') return;
    const c = this.ui.cursor;
    if (c) {
      const left = this.inv.add(c.id, c.count);
      if (left > 0) this.drops.spawn(this.player.x, this.player.eyeY, this.player.z, c.id, left);
      this.ui.cursor = null;
    }
    for (const stack of this.ui.craftGrid || []) {
      if (!stack) continue;
      const left = this.inv.add(stack.id, stack.count);
      if (left > 0) this.drops.spawn(this.player.x, this.player.eyeY, this.player.z, stack.id, left);
    }
    this.ui.craftGrid = new Array(9).fill(null);
    this.craftingTableOpen = false;
    this.resume();
  }
  selectHotbar(i) { this.inv.selected = clamp(i, 0, 8); }
  craft(r) {
    if (this.inv.craft(r)) { this.audio.play('craft'); this.ui.renderInventory(); }
    else this.ui.toast(this.inv.canCraft(r) ? 'Inventory is full' : 'Missing ingredients');
  }

  // ---------------------------------------------------------------- multiplayer (shared world)
  mpPrefs() {
    let p = {};
    try { p = JSON.parse(localStorage.getItem('eagle.mp') || '{}'); } catch (e) { /* ignore */ }
    const fresh = !p.name;
    const prefs = { name: mpCleanName(p.name || 'Player-' + Math.random().toString(36).slice(2, 6)), server: typeof p.server === 'string' ? p.server : '' };
    if (fresh) this._mpSavePrefs(prefs);
    return prefs;
  }
  _mpSavePrefs(p) { try { localStorage.setItem('eagle.mp', JSON.stringify({ name: p.name, server: p.server })); } catch (e) { /* ignore */ } }
  /** Same host that served the page (ws:// or wss://), or ws://localhost:8080 when opened from a file. ?mp=<url> overrides. */
  _mpDefaultUrl() {
    const q = /[?&]mp=([^&]+)/.exec(location.search || '');
    if (q) return decodeURIComponent(q[1]);
    return 'wss://vega.tail99932c.ts.net:8443' + MP_PATH;
  }

  _mpOpen(url, name) {
    const mp = new MultiplayerClient({
      url, name, localStore: this.store,
      callbacks: {
        onEdit: (e) => this._mpApplyEdit(e),
        onRevert: (e) => { this._mpApplyEdit(e); this.ui.toast('The server refused that block change'); },
        onJoin: (p) => this.ui.toast(p.name + ' joined'),
        onLeave: (p) => this.ui.toast(p.name + ' left'),
        onTime: (t) => { this.time = t; },
        onClose: (err) => this._mpLost(mp, err),
      },
    });
    return mp;
  }

  /** Main-menu "Multiplayer" button: connect to the one persistent shared world. */
  async joinMultiplayer(opts = {}) {
    if (!this.renderer) return;
    const prefs = this.mpPrefs();
    if (opts.name !== undefined) prefs.name = mpCleanName(opts.name);
    if (opts.server !== undefined) prefs.server = String(opts.server).trim();
    this._mpSavePrefs(prefs);
    const retry = (p) => this.joinMultiplayer(p), back = () => this.showMenu();
    let url;
    try { url = opts.url || mpNormalizeUrl(prefs.server || this._mpDefaultUrl(), location.protocol); }
    catch (e) { this.ui.showMpError(e.message, prefs, retry, back); return; }

    this._mpLeave();
    this.state = 'loading'; this.input.active = false;
    this.ui.showLoading('Connecting to the shared world…', () => this.showMenu());
    await this._teardown();
    const token = this.mpToken, mp = this._mpOpen(url, prefs.name);
    this.mp = mp; this.mpUrl = url;
    let info;
    try { info = await mp.connect(); }
    catch (e) {
      if (this.mp !== mp || token !== this.mpToken) return;     // cancelled while connecting
      this.mp = null; this.state = 'menu';
      this.ui.showMpError(e.message, prefs, retry, back);
      return;
    }
    if (this.mp !== mp || token !== this.mpToken) { mp.close(); return; }
    await this._mpEnter(info);
  }

  async _mpEnter(info) {
    this.mpMeta = { id: 'mp-' + hashString(this.mpUrl).toString(36) + '-' + info.seed, name: 'Shared World', seed: info.seed };
    this.ui.setMultiplayerHud(true);
    await this.playWorld(this.mpMeta, { multiplayer: true });
  }

  /** Leave the shared world on purpose (menu, errors, starting a singleplayer game). Also cancels reconnect loops. */
  _mpLeave() {
    this.mpToken++;
    const mp = this.mp;
    this.mp = null; this.mpPending = [];
    if (mp) mp.close();
    if (this.ui) this.ui.setMultiplayerHud(false);
  }

  /** The socket dropped mid-session: stop play, then retry with backoff. The world is rebuilt from the server on success. */
  _mpLost(mp, err) {
    if (this.mp !== mp) return;
    this.state = 'mp-lost'; this.input.reset(); this.input.setTouchVisible(false); this.input.unlockPointer(); this.breaking = null;
    this._mpReconnect(++this.mpToken, err);
  }

  async _mpReconnect(token, err) {
    const delays = [1000, 2000, 4000, 8000, 10000, 10000], name = this.mp ? this.mp.name : this.mpPrefs().name;
    let last = err;
    for (let i = 0; i < delays.length && !last.fatal; i++) {
      this.ui.showMpLost(`${last.message} Reconnecting… (attempt ${i + 1} of ${delays.length})`, null, () => this.showMenu());
      await new Promise((r) => setTimeout(r, delays[i]));
      if (token !== this.mpToken) return;
      const mp = this._mpOpen(this.mpUrl, name);
      try {
        const info = await mp.connect();
        if (token !== this.mpToken) { mp.close(); return; }
        if (this.mp) this.mp.close();
        this.mp = mp;
        await this._mpEnter(info);
        this.ui.toast('Reconnected');
        return;
      } catch (e) { mp.close(); last = e; }
    }
    if (token !== this.mpToken) return;
    this.ui.showMpLost(last.message, () => this._mpReconnect(++this.mpToken, last), () => this.showMenu());
  }

  _mpTick(dt, st) {
    const mp = this.mp;
    if (mp.status === 'closed' && st !== 'mp-lost') {   // dropped while the world was still loading: show the reconnect screen again
      this.state = 'mp-lost'; this.input.reset(); this.input.setTouchVisible(false); this.input.unlockPointer(); return;
    }
    mp.update(dt);
    if (mp.online && st !== 'loading') mp.sendPose(this.player, performance.now());
    if (this.mpPending.length) this._mpFlushPending();
  }

  /** Apply a server-confirmed block to the loaded world without echoing it back to the server. */
  _mpApplyEdit(e) {
    const w = this.world;
    if (!w) return;
    if (w.isLoaded(e.x, e.z)) {
      this._applyingRemote = true;
      try { w.setBlock(e.x, e.y, e.z, e.id); } finally { this._applyingRemote = false; }
    } else if (w.chunkAt(e.x >> 4, e.z >> 4) && this.mpPending.length < 2000) this.mpPending.push({ x: e.x, y: e.y, z: e.z });   // chunk is mid-generation
  }
  _mpFlushPending() {
    const w = this.world, keep = [];
    for (const c of this.mpPending) {
      if (w.isLoaded(c.x, c.z)) { const id = this.mp.net.get(c.x, c.y, c.z); if (id !== undefined) this._mpApplyEdit({ ...c, id }); }
      else if (w.chunkAt(c.x >> 4, c.z >> 4)) keep.push(c);
    }
    this.mpPending = keep;
  }

  // ---------------------------------------------------------------- settings
  settingsChanged(key) {
    this._saveSettings();
    if (key === 'volume') this.audio.volume = this.settings.volume;
    if (key === 'debug') this.setDebugVisible(this.settings.debug);
    if (key === 'renderDistance') { this.adaptive.curRd = this.settings.renderDistance; this.applyQuality(); }
    if (key === 'quality' && this.world) { this.world.ao = this.settings.quality !== 'low'; this.world.remeshAll(); }
    if (key === 'touchMode') this.input.setTouchVisible(this._touchMode() && this.state === 'play');
  }
  applyQuality() { if (this.world) this.world.setRenderDistance(this.adaptive.renderDistance); }
  setDebugVisible(v) { this.debugOn = !!v; if (!v && this.ui) this.ui.setDebug(null); }

  // ---------------------------------------------------------------- save
  _playerBlob() { return { ...this.player.serialize(), inv: this.inv.serialize(), time: this.time, spawn: this.spawn }; }
  async saveNow() {
    if (!this.world || !this.world.store || this.saving) return;
    this.saving = true;
    try { await this.world.save(this._playerBlob()); this.lastSave = performance.now(); }
    catch (e) { this._err(e); this.ui && this.ui.toast('Saving failed — will retry'); }
    finally { this.saving = false; }
  }

  // ---------------------------------------------------------------- main loop
  _frame(now) {
    const raw = now - this.last; this.last = now;
    const dt = clamp(raw / 1000, 0.0005, 0.05);
    try { this._tick(dt, raw); } catch (e) { this._err(e); }
    requestAnimationFrame((t) => this._frame(t));
  }

  _tick(dt, raw) {
    const inp = this.input.frame(dt);
    if (inp.debug) { this.settings.debug = !this.settings.debug; this.setDebugVisible(this.settings.debug); this._saveSettings(); }
    const st = this.state;
    if (st === 'menu' || st === 'init') return;
    if (!this.renderer || !this.world) return;
    if (st !== 'loading' && st !== 'bench-load') this.stats.add(raw);
    if (this.mp) this._mpTick(dt, st);

    if (st === 'loading' || st === 'bench-load') {
      this.world.update(this.player.x, this.player.z, 28);
      if (this._loadingReady() && performance.now() - this.loadingSince > 300) {
        if (st === 'bench-load') this._beginBench(); else this._enterPlay();
      }
      return;
    }

    if (st === 'play') {
      if (inp.pause) { this.pause(); return; }
      if (inp.inventory) { this.openInventory(); return; }
      this._play(dt, inp);
    } else if (st === 'inventory') {
      if (inp.inventory || inp.pause) this.closeInventory();
      this.world.update(this.player.x, this.player.z, 4);
    } else if (st === 'bench-run') {
      this._benchTick(dt);
    } else {
      this.world.update(this.player.x, this.player.z, 4);
    }
    this._render(dt);
    this.adaptive.update(dt, st === 'bench-run' ? 0 : this._recentAvg());
    this._debugTick(dt);
  }

  _recentAvg() {
    const s = this.stats, n = Math.min(90, s.filled);
    if (n < 45) return 0;
    let sum = 0; for (let i = 0; i < n; i++) sum += s.buf[(s.i - 1 - i + s.n) % s.n];
    return sum / n;
  }

  _play(dt, inp) {
    const p = this.player, w = this.world;
    if (inp.hotbarSet >= 0) this.selectHotbar(inp.hotbarSet);
    if (inp.hotbar) this.selectHotbar((this.inv.selected + inp.hotbar + 9) % 9);

    const creativeY = p.y;
    p.update(dt, inp, w, { autoJump: this.settings.autoJump });
    if (this.gameMode === 'creative') {
      // Creative flight: Space rises, Ctrl descends, and no vertical input hovers.
      p.y = creativeY;
      const down = this.input.keys.has('ControlLeft') || this.input.keys.has('ControlRight');
      const dy = (inp.jump ? 8 : down ? -8 : 0) * dt;
      const steps = Math.max(1, Math.ceil(Math.abs(dy) / 0.2));
      for (let s = 0; s < steps; s++) {
        const nextY = clamp(p.y + dy / steps, 0, CH - 1.81);
        let blocked = false;
        for (let x = Math.floor(p.x - 0.3); x <= Math.floor(p.x + 0.3) && !blocked; x++) {
          for (let z = Math.floor(p.z - 0.3); z <= Math.floor(p.z + 0.3) && !blocked; z++) {
            for (let y = Math.floor(nextY + 0.02); y <= Math.floor(nextY + 1.78); y++) {
              if (w.solid(x, y, z)) { blocked = true; break; }
            }
          }
        }
        if (blocked) break;
        p.y = nextY;
      }
      p.vy = 0; p.grounded = false;
      p.health = p.maxHealth; p.air = 100; p.dead = false; p.hurtFlash = 0;
      for (let i = p.events.length - 1; i >= 0; i--) if (p.events[i] === 'die') p.events.splice(i, 1);
    }

    for (const ev of p.events) this.audio.play(ev === 'land' ? 'step' : ev === 'die' ? 'die' : ev);
    p.events.length = 0;

    this.time += dt; this.day = dayState(this.time);
    this._interact(dt, inp);
    if (!this.mp && this.gameMode !== 'creative') this.mobs.update(dt, w, p, this.day);   // the shared world has no mobs yet (they would differ per client)
    this.drops.update(dt, w, p, this.inv, () => this.audio.play('pickup'));
    w.update(p.x, p.z, 4);

    this.saveT += dt;
    if (this.saveT > AUTOSAVE_S) { this.saveT = 0; this.saveNow(); }
    if (p.dead) { this.state = 'dead'; this.input.reset(); this.input.setTouchVisible(false); this.input.unlockPointer(); this.ui.showDeath(); this.breaking = null; }
  }

  _interact(dt, inp) {
    const p = this.player, w = this.world;
    const d = p.lookDir(), ex = p.x, ey = p.eyeY, ez = p.z;
    const hit = raycast(w, ex, ey, ez, d[0], d[1], d[2], REACH);
    const mh = this.mobs.raycast(ex, ey, ez, d[0], d[1], d[2], hit ? hit.dist : REACH);
    this.target = mh ? null : hit;
    this.breakCd -= dt; this.attackCd -= dt;
    const held = this.inv.held();

    if (inp.breakHeld) {
      if (mh) {
        this.breaking = null;
        if (this.attackCd <= 0) {
          this.attackCd = 0.42;
          const drops = this.mobs.hit(mh.mob, handDamage(held), p.x, p.z);
          this.audio.play('hit');
          if (drops) for (const [id, n] of drops) this.drops.spawn(mh.mob.x, mh.mob.y + 0.5, mh.mob.z, id, n);
        }
      } else if (hit && this.breakCd <= 0) {
        const b = this.breaking;
        if (!b || b.x !== hit.x || b.y !== hit.y || b.z !== hit.z) {
          this.breaking = { x: hit.x, y: hit.y, z: hit.z, id: hit.id, t: 0, info: this.gameMode === 'creative' ? { time: 0, harvest: true } : breakInfo(hit.id, held) };
        }
        const cur = this.breaking;
        if (cur.info) {
          cur.t += dt; this.breakSoundT -= dt;
          if (this.breakSoundT <= 0) { this.breakSoundT = 0.25; this.audio.play('mine'); }
          if (cur.t >= cur.info.time) this._breakBlock(cur);
        }
      } else if (!hit) this.breaking = null;
    } else this.breaking = null;

    if (inp.place) this._placeOrUse(hit, held);
  }

  _breakBlock(b) {
    const w = this.world, id = w.getBlock(b.x, b.y, b.z);
    if (id !== b.id) { this.breaking = null; return; }
    const drop = dropFor(id, b.info.harvest);
    w.setBlock(b.x, b.y, b.z, B.AIR);
    if (drop && this.gameMode !== 'creative') this.drops.spawn(b.x + 0.5, b.y + 0.5, b.z + 0.5, drop[0], drop[1]);
    this.audio.play('break'); this.breaking = null; this.breakCd = this.gameMode === 'creative' ? 0 : 0.18;
  }

  _placeOrUse(hit, held) {
    if (hit && (hit.id === B.DOOR || hit.id === B.DOOR_OPEN)) {
      const w = this.world;
      let by = hit.y;
      if (w.getBlock(hit.x, by - 1, hit.z) === B.DOOR || w.getBlock(hit.x, by - 1, hit.z) === B.DOOR_OPEN) by--;
      const current = w.getBlock(hit.x, by, hit.z);
      const next = current === B.DOOR ? B.DOOR_OPEN : B.DOOR;
      for (let dy = 0; dy < 2; dy++) {
        const id = w.getBlock(hit.x, by + dy, hit.z);
        if (id === B.DOOR || id === B.DOOR_OPEN) w.setBlock(hit.x, by + dy, hit.z, next);
      }
      this.audio.play('place');
      return;
    }
    if (hit && hit.id === B.TABLE) {
      this.openInventory(true);
      return;
    }
    if (!held) return;
    const it = getItem(held), p = this.player, w = this.world;
    if (it.food) {
      if (p.health < p.maxHealth) { p.heal(it.food); this.inv.takeHeld(); this.audio.play('eat'); } else this.ui.toast('Not hungry — health is full');
      return;
    }
    if (!hit || !isPlaceable(held)) return;
    const x = hit.x + hit.nx, y = hit.y + hit.ny, z = hit.z + hit.nz;
    const cur = w.getBlock(x, y, z);
    if (cur !== B.AIR && cur !== B.WATER) return;
    // do not entomb the player
    if (p.x + 0.3 > x && p.x - 0.3 < x + 1 && p.z + 0.3 > z && p.z - 0.3 < z + 1 && p.y + 1.8 > y && p.y < y + 1) return;
    if (w.setBlock(x, y, z, held)) {
      if (this.gameMode !== 'creative') this.inv.takeHeld();
      this.audio.play('place');
    }
  }

  // ---------------------------------------------------------------- rendering
  _render(dt) {
    const p = this.player, s = this.settings, r = this.renderer;
    const dprCap = QUALITY_DPR[s.quality] || 1;
    r.resize(window.innerWidth, window.innerHeight, window.devicePixelRatio || 1, dprCap, clamp(s.resScale * this.adaptive.resScale, 0.3, 1));
    const under = p.headInWater, d = this.day;
    const sky = under ? [0.08 * d.sun + 0.02, 0.22 * d.sun + 0.03, 0.45 * d.sun + 0.05] : d.sky;
    const rd = this.world.renderDistance;
    const frame = {
      eye: [p.x, p.eyeY, p.z], yaw: p.yaw, pitch: p.pitch, fov: (s.fov * Math.PI) / 180, sun: d.sun, sky, rd, fogRD: under ? 2.2 : rd,
      world: this.world, day: d,
      drawEntities: (mb, ex, ey, ez) => {
        const lim = (rd * CS) ** 2;
        for (const m of this.mobs.list) { const dx = m.x - ex, dz = m.z - ez; if (dx * dx + dz * dz < lim) emitMob(mb, m, dx, m.y - ey, dz); }
        if (this.mp) for (const other of this.mp.players.values()) {
          const dx = other.x - ex, dz = other.z - ez;
          if (dx * dx + dz * dz < lim) emitPlayer(mb, other, dx, other.y - ey, dz);
        }
        for (const dr of this.drops.list) emitDrop(mb, dr, getItem(dr.id).tile, this.time, ex, ey, ez);
        if (this.target && this.state === 'play') emitOutline(mb, this.target.x, this.target.y, this.target.z, ex, ey, ez);
      },
    };
    r.render(frame);
    if (this.state !== 'bench-run') this.ui.updateHud(this, this.breaking && this.breaking.info ? this.breaking.t / this.breaking.info.time : 0);
    if (this.mp) this.ui.updateMinimap(this);
  }

  // ---------------------------------------------------------------- debug overlay
  _debugTick(dt) {
    if (!this.debugOn) return;
    this.dbgT -= dt; if (this.dbgT > 0) return; this.dbgT = 0.25;
    const m = this.stats.snapshot(), w = this.world, ws = w.stats, rs = this.renderer.stats, p = this.player;
    const si = surfaceInfo(w.seed, Math.floor(p.x), Math.floor(p.z)), mem = memoryInfo();
    const f = (v, n = 1) => (+v).toFixed(n);
    this.ui.setDebug([
      `FPS ${f(m.fps, 0)}  avg ${f(m.avg)}ms  p50 ${f(m.p50)}  p95 ${f(m.p95)}  p99 ${f(m.p99)}  max ${f(m.max)}`,
      `frames>33ms ${m.over33}  >50ms ${m.over50}  (session ${m.frames} frames)`,
      `draws ${rs.draws}  tris ${(rs.tris / 1000).toFixed(0)}k  chunks ${rs.chunksDrawn} drawn / ${rs.chunksCulled} culled  ${rs.w}x${rs.h}`,
      `world: ${w.loadedCount} loaded, ${w.meshedCount} meshed  gen ${f(ws.genMs / Math.max(1, ws.genCount))}/${f(ws.genMax)}ms  mesh ${f(ws.meshMs / Math.max(1, ws.meshCount))}/${f(ws.meshMax)}ms  inflight ${ws.inflightGen}g/${ws.inflightMesh}m`,
      `jobs: ${w.jobs.kind}  gpu ${f(this.renderer.gpuBytes / 1048576)}MB  js ${mem.jsHeapUsedMB ?? 'n/a'}MB`,
      `rd ${w.renderDistance} (set ${this.settings.renderDistance})  scale ${f(this.adaptive.resScale * this.settings.resScale, 2)}  adaptive ${this.settings.adaptive ? 'on' : 'off'}`,
      `pos ${f(p.x)} ${f(p.y)} ${f(p.z)}  ${BIOME_NAMES[si.biome]}  time ${f(this.day.phase, 2)}  mobs ${this.mobs.list.length} drops ${this.drops.list.length}`,
      this.errors.length ? 'ERR ' + this.errors[this.errors.length - 1] : '',
    ].filter(Boolean).join('\n'));
  }

  // ---------------------------------------------------------------- benchmark
  startBenchmark() {
    if (!this.renderer) return;
    const seed = parseSeed('eagle-bench');
    const rdParam = /[?&]rd=(\d+)/.exec(location.search);
    if (rdParam) { this.settings.renderDistance = clamp(+rdParam[1], 3, 16); this.adaptive.curRd = this.settings.renderDistance; }
    this.settings.adaptive = false; this.adaptive.curRes = 1;
    this.benchSettings = { ...this.settings };
    this.playWorld({ id: 'bench', name: 'Benchmark', seed }, { ephemeral: true, bench: true });
  }
  _beginBench() {
    const spawn = findSpawn(this.meta.seed);
    this.bench = new Benchmark(spawn, BENCH_SECONDS); this.bench.t = 0;
    this.player.noclip = true; this.time = DAY_SECONDS * 0.25; this.day = dayState(this.time);
    this.ui.hideScreens(); this.ui.hud.style.display = 'none'; this.input.active = false;
    this.stats.reset(); this.renderer.stats.drawSum = 0;
    const ws = this.world.stats; this.benchBase = { genCount: ws.genCount, genMs: ws.genMs, meshCount: ws.meshCount, meshMs: ws.meshMs };
    ws.genMax = 0; ws.meshMax = 0; this.benchDraws = { draws: 0, tris: 0, n: 0 };
    this.debugOn = true; this.benchStart = performance.now();
    this.state = 'bench-run';
  }
  _benchTick(dt) {
    const b = this.bench, p = this.player;
    b.t += dt;
    const pose = b.pose(b.t);
    Object.assign(p, { x: pose.x, y: pose.y, z: pose.z, yaw: pose.yaw, pitch: pose.pitch });
    this.world.update(p.x, p.z, 4);
    const rs = this.renderer.stats; this.benchDraws.draws += rs.draws; this.benchDraws.tris += rs.tris; this.benchDraws.n++;
    if (b.t >= b.duration) this._finishBench();
  }
  _finishBench() {
    this.state = 'bench-done';
    const m = this.stats.snapshot(), ws = this.world.stats, base = this.benchBase, n = this.benchDraws.n || 1;
    const report = {
      kind: 'eagle-benchmark', date: new Date().toISOString(), scene: { seed: 'eagle-bench', path: 'circle r=55 @ y=62, 30 s, noon', renderDistance: this.world.renderDistance },
      device: { userAgent: navigator.userAgent, screen: `${screen.width}x${screen.height}`, dpr: window.devicePixelRatio, canvas: `${this.renderer.stats.w}x${this.renderer.stats.h}`, cores: navigator.hardwareConcurrency },
      settings: { quality: this.settings.quality, resScale: this.settings.resScale, fov: this.settings.fov, adaptive: false }, jobs: this.world.jobs.kind,
      frameTimeMs: { avg: +m.avg.toFixed(2), fps: +m.fps.toFixed(1), p50: +m.p50.toFixed(2), p95: +m.p95.toFixed(2), p99: +m.p99.toFixed(2), max: +m.max.toFixed(2), over33ms: m.over33, over50ms: m.over50, frames: m.frames, histogram: m.histogram },
      renderer: { avgDraws: Math.round(this.benchDraws.draws / n), avgTris: Math.round(this.benchDraws.tris / n), gpuMB: +(this.renderer.gpuBytes / 1048576).toFixed(1) },
      chunks: { generated: ws.genCount - base.genCount, genAvgMs: +((ws.genMs - base.genMs) / Math.max(1, ws.genCount - base.genCount)).toFixed(2), genMaxMs: +ws.genMax.toFixed(2), meshed: ws.meshCount - base.meshCount, meshAvgMs: +((ws.meshMs - base.meshMs) / Math.max(1, ws.meshCount - base.meshCount)).toFixed(2), meshMaxMs: +ws.meshMax.toFixed(2) },
      memory: memoryInfo(),
      caveat: 'Numbers describe this device/browser at the time of the run only. They do not establish a 60 FPS target on any other hardware.',
    };
    window.__EAGLE_BENCH__ = report; console.log('[eagle] benchmark', JSON.stringify(report));
    const text = JSON.stringify(report, null, 2);
    this.ui.hud.style.display = 'none';
    this.ui.show('report', this.ui.panel('Benchmark result',
      h('pre', { class: 'report', text }),
      h('div', { class: 'row' },
        this.ui.btn('Copy JSON', () => { try { navigator.clipboard.writeText(text); this.ui.toast('Copied'); } catch (e) { /* ignore */ } }),
        this.ui.btn('Back to menu', () => { this.settings = { ...this.settings, ...this.benchSettings }; this.input.settings = this.settings; this.showMenu(); }, 'primary'))));
  }
}

// ---- boot.js ----
// Browser entry point.
const workerEl = document.getElementById('eagle-worker');
const game = new Game({
  canvas: document.getElementById('view'),
  uiRoot: document.getElementById('ui'),
  touchRoot: document.getElementById('touch'),
  workerSource: workerEl ? workerEl.textContent : '',
});
window.eagle = {
  game,
  tp: (x, y, z) => { Object.assign(game.player, { x, y, z, vy: 0 }); },
  noclip: (v = true) => { game.player.noclip = !!v; },
  report: () => ({ stats: game.stats.snapshot(), world: game.world && game.world.stats, errors: game.errors }),
};
game.init().catch((e) => { document.body.textContent = 'Failed to start: ' + (e && e.message); console.error(e); });

</script>
