  }
}

// ---- audio/audio.js ----
// Procedural sound effects (WebAudio). No audio assets; created lazily after the first user gesture.
class Audio {
  constructor() { this.ctx = null; this.volume = 0.6; this.noise = null; this.last = {}; }

  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    try {
      this.ctx = new AC();
      const n = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, n, n), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    } catch (e) { this.ctx = null; }
  }

  _burst(freq, dur, gain, type = 'noise', slide = 0) {
    const c = this.ctx; if (!c || this.volume <= 0) return;
    const t = c.currentTime, g = c.createGain();
    g.gain.setValueAtTime(gain * this.volume, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    g.connect(c.destination);
    if (type === 'noise') {
      const s = c.createBufferSource(); s.buffer = this.noise; s.playbackRate.value = 0.5 + Math.random() * 0.3;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9;
      s.connect(f); f.connect(g); s.start(t, Math.random() * 0.5, dur);
    } else {
      const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      o.connect(g); o.start(t); o.stop(t + dur);
    }
  }

  play(name) {
    if (!this.ctx) return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < 45) return;   // avoid piling up identical sounds
    this.last[name] = now;
    switch (name) {
      case 'break': this._burst(700, 0.16, 0.5); break;
      case 'place': this._burst(380, 0.1, 0.45); break;
      case 'mine': this._burst(1200, 0.05, 0.18); break;
      case 'step': this._burst(260, 0.07, 0.16); break;
      case 'hit': this._burst(500, 0.1, 0.5, 'square', -250); break;
      case 'hurt': this._burst(300, 0.22, 0.5, 'sawtooth', -180); break;
      case 'pickup': this._burst(900, 0.09, 0.25, 'sine', 500); break;
      case 'eat': this._burst(500, 0.12, 0.3); break;
      case 'splash': this._burst(500, 0.3, 0.35); break;
      case 'die': this._burst(220, 0.7, 0.5, 'sawtooth', -150); break;
      case 'groan': this._burst(120, 0.5, 0.3, 'sawtooth', -40); break;
      case 'craft': this._burst(600, 0.12, 0.3, 'triangle', 250); break;
      default: break;
    }
  }
}

// ---- input/input.js ----
// Unified input: keyboard + mouse (pointer lock), touch (floating joystick, swipe look, buttons), gamepad.
// Everything is reduced to one per-frame intent object so gameplay never knows the device.
const dead = (v, d = 0.15) => (Math.abs(v) < d ? 0 : (v - Math.sign(v) * d) / (1 - d));

class Input {
  constructor(canvas, touchRoot, settings) {
    this.canvas = canvas; this.root = touchRoot; this.s = settings;
    this.keys = new Set(); this.active = false;           // active: gameplay owns the keyboard
    this.lookX = 0; this.lookY = 0;
    this.mouseBreak = false; this.touchBreak = false; this.touchJump = false;
    this.edges = { place: false, inventory: false, pause: false, debug: false, hotbar: 0, hotbarSet: -1 };
    this.joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
    this.lookTouch = { id: null, x: 0, y: 0 };
    this.out = { moveX: 0, moveY: 0, jump: false, sprint: false, lookX: 0, lookY: 0, breakHeld: false, place: false, inventory: false, pause: false, debug: false, hotbar: 0, hotbarSet: -1, usingTouch: false, usingPad: false };
    this.padPrev = [];
    this.touchSeen = false;
    this._bindKeyboardMouse();
    this._buildTouch();
  }

  // ---------------- keyboard / mouse ----------------
  _bindKeyboardMouse() {
    const E = this.edges;
    window.addEventListener('keydown', (e) => {
      if (e.code === 'F3') { E.debug = true; e.preventDefault(); return; }
      if (!this.active) return;
      if (e.repeat) { if (this._isGameKey(e.code)) e.preventDefault(); return; }
      this.keys.add(e.code);
      if (e.code === 'KeyE') E.inventory = true;
      else if (e.code === 'Escape') E.pause = true;
      else if (e.code.startsWith('Digit')) { const n = +e.code.slice(5) - 1; if (n >= 0 && n < 9) E.hotbarSet = n; }
      if (this._isGameKey(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => this.keys.delete(e.code));
    window.addEventListener('blur', () => { this.keys.clear(); this.mouseBreak = false; });
    this.canvas.addEventListener('mousedown', (e) => {
      if (!this.active || e.pointerType === 'touch') return;
      if (e.button === 0) this.mouseBreak = true; else if (e.button === 2) E.place = true;
      e.preventDefault();
    });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) this.mouseBreak = false; });
    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('mousemove', (e) => {
      if (!this.active || document.pointerLockElement !== this.canvas) return;
      const k = 0.0022 * this.s.lookSens;
      this.lookX += e.movementX * k; this.lookY += e.movementY * k * (this.s.invertY ? -1 : 1);
    });
    this.canvas.addEventListener('wheel', (e) => { if (this.active) { E.hotbar += Math.sign(e.deltaY); e.preventDefault(); } }, { passive: false });
  }
  _isGameKey(c) { return /^(Key[WASDE]|Space|Arrow|Shift|Control|Tab|F3)/.test(c); }
  lockPointer() { if (this.canvas.requestPointerLock) { try { const p = this.canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignored */ } } }
  unlockPointer() { if (document.exitPointerLock && document.pointerLockElement) document.exitPointerLock(); }

  // ---------------- touch ----------------
  _el(cls, parent, text) { const d = document.createElement('div'); d.className = cls; if (text) d.textContent = text; parent.appendChild(d); return d; }
  _buildTouch() {
    const root = this.root; this.touchEls = [];
    const stop = (e) => e.preventDefault();
    // Block browser gestures (pinch zoom, scroll, pull-to-refresh, double-tap zoom, context menu).
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, stop, { passive: false }));
    document.addEventListener('touchmove', (e) => { if (this.active) e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick', stop);

    const look = this._el('tz tz-look', root), move = this._el('tz tz-move', root);
    const base = this._el('joy-base', root), knob = this._el('joy-knob', base);
    this.joyBase = base; this.joyKnob = knob;
    this.touchEls.push(look, move, base);

    const J = this.joy;
    const radius = () => 62 * this.s.joystickSize;
    move.addEventListener('pointerdown', (e) => {
      if (J.id !== null) return;
      this.touchSeen = true; move.setPointerCapture(e.pointerId); J.id = e.pointerId; J.ox = e.clientX; J.oy = e.clientY; J.x = J.y = 0;
      const r = radius();
      base.style.cssText = `display:block;left:${e.clientX - r}px;top:${e.clientY - r}px;width:${r * 2}px;height:${r * 2}px`;
      knob.style.transform = 'translate(-50%,-50%)';
    });
    move.addEventListener('pointermove', (e) => {
      if (e.pointerId !== J.id) return;
      let dx = (e.clientX - J.ox) / radius(), dy = (e.clientY - J.oy) / radius();
      const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
      J.x = dx; J.y = -dy;
      knob.style.transform = `translate(calc(-50% + ${dx * radius()}px), calc(-50% + ${dy * radius()}px))`;
    });
    const endMove = (e) => { if (e.pointerId !== J.id) return; J.id = null; J.x = J.y = 0; base.style.display = 'none'; };
    move.addEventListener('pointerup', endMove); move.addEventListener('pointercancel', endMove);

    const L = this.lookTouch;
    look.addEventListener('pointerdown', (e) => {
      if (L.id !== null) return;
      this.touchSeen = true; look.setPointerCapture(e.pointerId); L.id = e.pointerId; L.x = e.clientX; L.y = e.clientY;
    });
    look.addEventListener('pointermove', (e) => {
      if (e.pointerId !== L.id) return;
      const k = 0.0052 * this.s.touchSens;
      this.lookX += (e.clientX - L.x) * k; this.lookY += (e.clientY - L.y) * k * (this.s.invertY ? -1 : 1);
      L.x = e.clientX; L.y = e.clientY;
    });
    const endLook = (e) => { if (e.pointerId === L.id) L.id = null; };
    look.addEventListener('pointerup', endLook); look.addEventListener('pointercancel', endLook);

    const hold = (cls, label, set) => {
      const b = this._el('tbtn ' + cls, root, label); this.touchEls.push(b);
      b.addEventListener('pointerdown', (e) => { this.touchSeen = true; b.setPointerCapture(e.pointerId); b.classList.add('down'); set(true); e.preventDefault(); });
      const up = () => { b.classList.remove('down'); set(false); };
      b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
      return b;
    };
    hold('t-jump', 'Jump', (v) => { this.touchJump = v; });
    hold('t-mine', 'Mine', (v) => { this.touchBreak = v; });
    hold('t-place', 'Use', (v) => { if (v) this.edges.place = true; });
    hold('t-inv', 'Bag', (v) => { if (v) this.edges.inventory = true; });
    hold('t-pause', 'Menu', (v) => { if (v) this.edges.pause = true; });
  }
  setTouchVisible(v) { this.root.style.display = v ? 'block' : 'none'; if (!v) { this.joy.id = null; this.joy.x = this.joy.y = 0; this.touchBreak = this.touchJump = false; } }

  // ---------------- gamepad ----------------
  _pad(dt, o) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const p = Array.from(pads || []).find((g) => g && g.connected);
    if (!p) return false;
    const a = p.axes, b = (i) => (p.buttons[i] ? p.buttons[i].pressed : false);
    const edge = (i) => { const now = b(i), was = this.padPrev[i]; this.padPrev[i] = now; return now && !was; };
    const mx = dead(a[0] || 0), my = dead(-(a[1] || 0));
    const lx = dead(a[2] || 0), ly = dead(a[3] || 0);
    const k = 2.8 * dt * this.s.touchSens;
    this.lookX += lx * k; this.lookY += ly * k * (this.s.invertY ? -1 : 1);
    o.moveX += mx; o.moveY += my;
    if (b(0)) o.jump = true;
    if (b(10) || (p.axes[1] < -0.95)) o.sprint = true;
    if (p.buttons[7] && p.buttons[7].value > 0.4) o.breakHeld = true;
    if (edge(6)) this.edges.place = true;
    if (edge(5)) this.edges.hotbar += 1; if (edge(4)) this.edges.hotbar -= 1;
    if (edge(3)) this.edges.inventory = true;
    if (edge(9)) this.edges.pause = true;
    return mx !== 0 || my !== 0 || lx !== 0 || ly !== 0 || b(0) || b(7);
  }

  /** Collect intents for this frame and clear one-shot events. */
  frame(dt) {
    const o = this.out, K = this.keys, E = this.edges;
    const kx = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0);
    const ky = (K.has('KeyW') || K.has('ArrowUp') ? 1 : 0) - (K.has('KeyS') || K.has('ArrowDown') ? 1 : 0);
    o.moveX = kx + this.joy.x; o.moveY = ky + this.joy.y;
    o.jump = K.has('Space') || this.touchJump;
    o.sprint = K.has('ShiftLeft') || K.has('ControlLeft') || Math.hypot(this.joy.x, this.joy.y) > 0.96;
    o.breakHeld = this.mouseBreak || this.touchBreak;
    o.usingPad = this._pad(dt, o);
    o.usingTouch = this.touchSeen;
    o.lookX = this.lookX; o.lookY = this.lookY; this.lookX = this.lookY = 0;
    o.place = E.place; o.inventory = E.inventory; o.pause = E.pause; o.debug = E.debug; o.hotbar = E.hotbar; o.hotbarSet = E.hotbarSet;
    E.place = E.inventory = E.pause = E.debug = false; E.hotbar = 0; E.hotbarSet = -1;
    return o;
  }

  /** Drop any held state (menus opening, tab switching). */
  reset() { this.keys.clear(); this.mouseBreak = this.touchBreak = this.touchJump = false; this.joy.id = null; this.joy.x = this.joy.y = 0; this.lookTouch.id = null; this.lookX = this.lookY = 0; if (this.joyBase) this.joyBase.style.display = 'none'; }
}

// ---- net/protocol.js ----
// Multiplayer wire protocol shared by the browser client and the Node server.
// Transport: one WebSocket, JSON text frames {t: <type>, ...}. Pure functions only (no DOM, no Node APIs).
//
// client -> server   join {protocol,name} | pose {x,y,z,yaw,pitch} | edit {x,y,z,id} | ping {n}
// server -> client   welcome {id,seed,time,players} | edits {e:[x,y,z,id,...]} | synced
//                    join {p} | leave {id,name} | poses {p:[[id,x,y,z,yaw,pitch],...]}
//                    edit {x,y,z,id,by} | reject {x,y,z,reason} | time {v} | pong {n} | error {code,message}

const MP_PROTOCOL = 1;
const MP_PATH = '/mp';
const MP_LIMITS = { maxPlayers: 32, maxName: 16, coord: 1000000, reach: 8, maxEdits: 1000000, syncBatch: 4000 };
/** WebSocket close codes (4000-4999 are application-defined). */
const MP_CLOSE = { FULL: 4001, VERSION: 4002, RATE: 4003, PROTOCOL: 4004, IDLE: 4005, SHUTDOWN: 4006 };

const q3 = (v) => Math.round(v * 1000) / 1000;

function mpCleanName(v) {
  const s = String(v ?? '').replace(/[\u0000-\u001f\u007f<>&"'`]/g, '').replace(/\s+/g, ' ').trim().slice(0, MP_LIMITS.maxName);
  return s || 'Player';
}

/** Validate and normalise a pose message; returns {x,y,z,yaw,pitch} (rounded) or null. */
function mpValidPose(m) {
  if (!m || typeof m !== 'object') return null;
  const { x, y, z, yaw, pitch } = m;
  if (![x, y, z, yaw, pitch].every((v) => typeof v === 'number' && Number.isFinite(v))) return null;
  const c = MP_LIMITS.coord;
  if (Math.abs(x) > c || Math.abs(z) > c || y < -64 || y > CH + 160) return null;
  const TAU = Math.PI * 2;
  let yw = yaw % TAU; if (yw > Math.PI) yw -= TAU; else if (yw < -Math.PI) yw += TAU;
  return { x: q3(x), y: q3(y), z: q3(z), yaw: q3(yw), pitch: q3(Math.max(-1.571, Math.min(1.571, pitch))) };
}

/** Validate a block edit message; returns {x,y,z,id} or null. (Placeability is checked by the server.) */
function mpValidEdit(m) {
  if (!m || typeof m !== 'object') return null;
  const { x, y, z, id } = m;
  if (![x, y, z, id].every((v) => Number.isInteger(v))) return null;
  if (Math.abs(x) > MP_LIMITS.coord || Math.abs(z) > MP_LIMITS.coord || y < 0 || y >= CH || id < 0 || id > 255) return null;
  return { x, y, z, id };
}

/** Accept "host:port", "ws://host:port", "http://host" ... and return a ws(s) URL ending in /mp, or throw. */
function mpNormalizeUrl(text, pageProtocol = 'http:') {
  let s = String(text ?? '').trim();
  if (!s) throw new Error('Enter a server address.');
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = (pageProtocol === 'https:' ? 'wss://' : 'ws://') + s;
  s = s.replace(/^http:\/\//i, 'ws://').replace(/^https:\/\//i, 'wss://');
  let u;
  try { u = new URL(s); } catch { throw new Error('That does not look like a valid server address.'); }
  if (u.protocol !== 'ws:' && u.protocol !== 'wss:') throw new Error('Server address must start with ws:// or wss://.');
  if (!u.hostname) throw new Error('That does not look like a valid server address.');
  if (u.pathname === '/' || u.pathname === '') u.pathname = MP_PATH;
  return u.toString();
}

/** Forward direction on the ground plane for a yaw (matches Player.lookDir): [dx, dz]. */
const mpForward = (yaw) => [-Math.sin(yaw), -Math.cos(yaw)];

// ---- net/client.js ----
// Multiplayer client: WebSocket transport, remote-player interpolation and a mirror of the server's block edits.
// No DOM access. The WebSocket constructor and clock are injectable so it can be tested in Node.


const MP_TAU = Math.PI * 2;

function mpError(code, message, fatal = false) { return Object.assign(new Error(message), { code, fatal }); }

/**
 * Chunk-diff source for World, built from the server's block edits.
 * World already knows how to apply per-chunk diffs when a chunk is (re)generated, so the shared world's
 * edits ride on that path: no new chunk-loading code. The player's own blob (position, inventory) is
 * still saved to the local store, so you keep your items between sessions.
 */
class NetStore {
  constructor(local) { this.local = local || null; this.cells = new Map(); }
  record(x, y, z, id) {
    const k = (x >> 4) + ',' + (z >> 4);
    let m = this.cells.get(k);
    if (!m) { m = new Map(); this.cells.set(k, m); }
    m.set(bidx(x & 15, y, z & 15), id);
  }
  get(x, y, z) { const m = this.cells.get((x >> 4) + ',' + (z >> 4)); return m ? m.get(bidx(x & 15, y, z & 15)) : undefined; }
  get size() { let n = 0; for (const m of this.cells.values()) n += m.size; return n; }
  async loadChunk(wid, cx, cz) {
    const m = this.cells.get(cx + ',' + cz);
    if (!m || !m.size) return null;
    const i = new Uint16Array(m.size), v = new Uint8Array(m.size);
    let n = 0;
    for (const [idx, id] of m) { i[n] = idx; v[n] = id; n++; }
    return { i, v };
  }
  async loadPlayer(wid) { return this.local ? this.local.loadPlayer(wid) : null; }
  async commit(wid, { player }) { if (this.local && player) await this.local.commit(wid, { player, chunks: [] }); }
}

class MultiplayerClient {
  /**
   * @param {{url:string, name:string, localStore?:object, WS?:Function, now?:()=>number, callbacks?:object}} o
   * callbacks: onEdit({x,y,z,id}) onRevert({x,y,z,id}) onJoin(p) onLeave(p) onTime(t) onClose(err)
   */
  constructor(o) {
    this.url = o.url; this.name = o.name;
    this.WS = o.WS || (typeof WebSocket !== 'undefined' ? WebSocket : null);
    this.now = o.now || (() => performance.now());
    this.cb = o.callbacks || {};
    this.net = new NetStore(o.localStore);
    this.status = 'idle';                 // idle | connecting | online | closed
    this.id = null; this.seed = 0; this.serverTime = 0; this.timeAt = 0;
    this.players = new Map();             // remote players only
    this.pending = new Map();             // "x,y,z" -> {old, n}: our edits the server has not confirmed yet
    this.lastPose = null; this.lastPoseAt = -1e9;
    this.serverError = null; this.closing = false; this.ws = null;
    this.stats = { rx: 0, tx: 0 };
  }

  get online() { return this.status === 'online'; }
  worldTime() { return this.serverTime + (this.now() - this.timeAt) / 1000; }

  /** Open the socket and resolve once the server has sent the world seed and every stored block edit. */
  connect(timeoutMs = 8000) {
    return new Promise((resolve, reject) => {
      if (!this.WS) { reject(mpError('unsupported', 'This browser has no WebSocket support.', true)); return; }
      let settled = false, opened = false, ws, timer;
      const fail = (err) => {
        if (settled) return; settled = true; clearTimeout(timer); this.status = 'closed';
        try { ws && ws.close(); } catch (e) { /* already closed */ }
        reject(err);
      };
      try { ws = new this.WS(this.url); } catch (e) { reject(mpError('badurl', 'Invalid server address.', true)); return; }
      this.ws = ws; this.status = 'connecting';
      timer = setTimeout(() => fail(mpError('timeout', `No answer from ${this.url}.`)), timeoutMs);
      ws.onopen = () => { opened = true; this._send({ t: 'join', protocol: MP_PROTOCOL, name: this.name }); };
      // An error before the socket opened is a failed connect (refused, DNS, TLS, or a non-WebSocket answer).
      // Browsers follow it with a close event, Node's built-in WebSocket does not, so do not wait for one.
      ws.onerror = () => { if (!opened) fail(this._closeError({ code: 1006 }, false)); };
      ws.onmessage = (ev) => {
        const done = this._onMessage(ev.data);
        if (done && !settled) { settled = true; clearTimeout(timer); this.status = 'online'; resolve({ id: this.id, seed: this.seed, time: this.worldTime(), players: this.players.size }); }
      };
      ws.onclose = (ev) => {
        if (!settled) fail(this._closeError(ev, false));
        else if (!this.closing) this._lost(this._closeError(ev, true));
      };
    });
  }

  _closeError(ev, wasOnline) {
    const c = ev && ev.code, srv = this.serverError;
    if (c === MP_CLOSE.FULL) return mpError('full', srv || 'The server is full. Try again in a moment.');
    if (c === MP_CLOSE.VERSION) return mpError('version', srv || 'This server runs a different version of Eagle multiplayer.', true);
    if (c === MP_CLOSE.RATE) return mpError('rate', 'Disconnected: too many messages were sent.');
    if (c === MP_CLOSE.PROTOCOL) return mpError('protocol', srv || 'Disconnected after a protocol error.');
    if (c === MP_CLOSE.IDLE) return mpError('idle', 'Disconnected: the connection timed out.');
    if (c === MP_CLOSE.SHUTDOWN) return mpError('shutdown', 'The server is restarting.');
    return mpError(wasOnline ? 'lost' : 'unreachable', wasOnline ? 'The connection to the server was lost.' : `Could not connect to ${this.url}. Is the server running?`);
  }

  _lost(err) {
    if (this.status === 'closed') return;
    this.status = 'closed'; this.players.clear();
    if (this.cb.onClose) this.cb.onClose(err);
  }

  /** Leave on purpose; no onClose callback fires. */
  close() {
    this.closing = true; this.status = 'closed'; this.players.clear();
    try { this.ws && this.ws.close(1000, 'bye'); } catch (e) { /* ignore */ }
  }

  _send(obj) {
    const ws = this.ws;
    if (!ws || ws.readyState !== 1) return false;
    try { ws.send(JSON.stringify(obj)); this.stats.tx++; return true; } catch (e) { return false; }
  }

  _remote(p) {
    const r = { id: p.id, name: p.name, x: p.x, y: p.y, z: p.z, yaw: p.yaw, pitch: p.pitch, tx: p.x, ty: p.y, tz: p.z, tyaw: p.yaw, tpitch: p.pitch, phase: 0, swing: 0, ready: true };
    this.players.set(p.id, r);
    return r;
  }

  /** Returns true when the initial world sync is complete. */
  _onMessage(data) {
    if (typeof data !== 'string') return false;
    let m; try { m = JSON.parse(data); } catch (e) { return false; }
    if (!m || typeof m !== 'object') return false;
    this.stats.rx++;
    switch (m.t) {
      case 'welcome':
        this.id = m.id; this.seed = m.seed; this.serverTime = Number(m.time) || 0; this.timeAt = this.now();
        this.players.clear();
        for (const p of m.players || []) if (p.id !== this.id) this._remote(p);
        break;
      case 'edits': {
        const e = m.e || [];
        for (let i = 0; i + 3 < e.length; i += 4) this.net.record(e[i], e[i + 1], e[i + 2], e[i + 3]);
        break;
      }
      case 'synced': return true;
      case 'join': if (m.p && m.p.id !== this.id) { this._remote(m.p); if (this.cb.onJoin) this.cb.onJoin(m.p); } break;
      case 'leave': { const r = this.players.get(m.id); this.players.delete(m.id); if (r && this.cb.onLeave) this.cb.onLeave({ id: m.id, name: m.name || r.name }); break; }
      case 'poses':
        for (const q of m.p || []) {
          const r = this.players.get(q[0]);
          if (r) { r.tx = q[1]; r.ty = q[2]; r.tz = q[3]; r.tyaw = q[4]; r.tpitch = q[5]; }
        }
        break;
      case 'edit': this._onEdit(m); break;
      case 'reject': this._onReject(m); break;
      case 'time': this.serverTime = Number(m.v) || 0; this.timeAt = this.now(); if (this.cb.onTime) this.cb.onTime(this.serverTime); break;
      case 'error': this.serverError = String(m.message || m.code || 'Server error'); break;
      default: break;
    }
    return false;
  }

  _onEdit(m) {
    if (![m.x, m.y, m.z, m.id].every(Number.isInteger)) return;
    this.net.record(m.x, m.y, m.z, m.id);
    if (m.by === this.id) {
      const k = m.x + ',' + m.y + ',' + m.z, p = this.pending.get(k);
      if (p) { if (--p.n <= 0) this.pending.delete(k); }
    }
    if (this.cb.onEdit) this.cb.onEdit({ x: m.x, y: m.y, z: m.z, id: m.id });
  }

  _onReject(m) {
    const k = m.x + ',' + m.y + ',' + m.z, p = this.pending.get(k);
    if (!p) return;
    if (--p.n > 0) return;
    this.pending.delete(k);
    this.net.record(m.x, m.y, m.z, p.old);
    if (this.cb.onRevert) this.cb.onRevert({ x: m.x, y: m.y, z: m.z, id: p.old });
  }

  /** Report a local block change ({x,y,z,id,old} straight from World.hooks.edit). */
  sendEdit(e) {
    if (this.status !== 'online') return false;
    this.net.record(e.x, e.y, e.z, e.id);
    const k = e.x + ',' + e.y + ',' + e.z, p = this.pending.get(k);
    if (p) p.n++; else this.pending.set(k, { old: e.old, n: 1 });
    return this._send({ t: 'edit', x: e.x, y: e.y, z: e.z, id: e.id });
  }

  /** Send our pose: at most 20/s while moving or turning, once a second while idle (keep-alive). */
  sendPose(p, now = this.now()) {
    if (this.status !== 'online') return false;
    const L = this.lastPose, gap = now - this.lastPoseAt;
    const moved = !L || Math.abs(p.x - L.x) + Math.abs(p.y - L.y) + Math.abs(p.z - L.z) > 0.004 || Math.abs(p.yaw - L.yaw) > 0.002 || Math.abs(p.pitch - L.pitch) > 0.002;
    if (moved ? gap < 50 : gap < 1000) return false;
    this.lastPose = { x: p.x, y: p.y, z: p.z, yaw: p.yaw, pitch: p.pitch }; this.lastPoseAt = now;
    return this._send({ t: 'pose', x: p.x, y: p.y, z: p.z, yaw: p.yaw, pitch: p.pitch });
  }

  /** Smooth remote players toward their last reported pose (called every frame). */
  update(dt) {
    const k = 1 - Math.exp(-dt * 14), inv = 1 / Math.max(dt, 1e-3);
    for (const r of this.players.values()) {
      const ox = r.x, oz = r.z, dx = r.tx - r.x, dy = r.ty - r.y, dz = r.tz - r.z;
      if (dx * dx + dy * dy + dz * dz > 100) { r.x = r.tx; r.y = r.ty; r.z = r.tz; }   // teleport / respawn: snap
      else { r.x += dx * k; r.y += dy * k; r.z += dz * k; }
      let dyaw = r.tyaw - r.yaw; dyaw = ((dyaw + Math.PI) % MP_TAU + MP_TAU) % MP_TAU - Math.PI;   // shortest turn
      r.yaw += dyaw * k; r.pitch += (r.tpitch - r.pitch) * k;
      const sp = Math.min(8, Math.hypot(r.x - ox, r.z - oz) * inv);
      r.swing += ((sp > 0.4 ? 1 : 0) - r.swing) * Math.min(1, dt * 10);
      r.phase += sp * dt * 2.2;
    }
  }
}

// ---- ui/ui.js ----
// DOM user interface: menus, HUD, hotbar, inventory + crafting, settings, debug overlay.


const DEFAULT_SETTINGS = {
  renderDistance: 6, resScale: 1, fov: 72, lookSens: 1, touchSens: 1, joystickSize: 1, quality: 'high',
  adaptive: true, autoJump: true, volume: 0.6, touchMode: 'auto', debug: false, invertY: false,
};
const QUALITY_DPR = { low: 1, medium: 1.5, high: 2 };
const MM_RANGE = 64, MM_SIZE = 112;   // minimap radius in blocks, size in CSS px

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}

const SETTING_DEFS = [
  { k: 'renderDistance', label: 'Render distance', type: 'range', min: 3, max: 12, step: 1, fmt: (v) => v + ' chunks' },
  { k: 'resScale', label: 'Resolution scale', type: 'range', min: 0.5, max: 1, step: 0.05, fmt: (v) => Math.round(v * 100) + '%' },
  { k: 'quality', label: 'Graphics', type: 'select', opts: [['low', 'Low (no AO, 1x pixels)'], ['medium', 'Medium (AO, 1.5x)'], ['high', 'High (AO, 2x)']] },
  { k: 'fov', label: 'Field of view', type: 'range', min: 55, max: 100, step: 1, fmt: (v) => v + '°' },
  { k: 'adaptive', label: 'Adaptive quality (auto-lowers resolution/distance when slow)', type: 'check' },
  { k: 'lookSens', label: 'Mouse sensitivity', type: 'range', min: 0.3, max: 3, step: 0.1, fmt: (v) => v.toFixed(1) + 'x' },
  { k: 'touchSens', label: 'Touch / stick look sensitivity', type: 'range', min: 0.3, max: 3, step: 0.1, fmt: (v) => v.toFixed(1) + 'x' },
  { k: 'joystickSize', label: 'Joystick size', type: 'range', min: 0.7, max: 1.6, step: 0.1, fmt: (v) => v.toFixed(1) + 'x' },
  { k: 'touchMode', label: 'Touch controls', type: 'select', opts: [['auto', 'Auto'], ['on', 'Always on'], ['off', 'Off']] },
  { k: 'autoJump', label: 'Auto-jump one-block steps', type: 'check' },
  { k: 'invertY', label: 'Invert look Y', type: 'check' },
  { k: 'volume', label: 'Volume', type: 'range', min: 0, max: 1, step: 0.05, fmt: (v) => Math.round(v * 100) + '%' },
  { k: 'debug', label: 'Debug overlay (F3)', type: 'check' },
];

class UI {
  constructor(root, game) {
    this.g = game; this.root = root; this.atlasUrl = ''; this.cursor = null; this.screen = null; this.cache = {}; this.invEls = null;
    this.craftGrid = new Array(9).fill(null); this.recipeBookOpen = true;
    // the inventory is sized from the screen, so rebuild it when the window or orientation changes
    const relayout = () => { if (this.screen === 'inventory') this.renderInventory(); };
    window.addEventListener('resize', relayout); window.addEventListener('orientationchange', relayout);
    this.hud = h('div', { class: 'hud' });
    this.cross = h('div', { class: 'cross' });
    this.vignette = h('div', { class: 'hurt' });
    this.hpBar = h('div', { class: 'bar hp' }, this.hpFill = h('i'), this.hpText = h('span'));
    this.airBar = h('div', { class: 'bar air' }, this.airFill = h('i'));
    this.mineBar = h('div', { class: 'mine' }, this.mineFill = h('i'));
    this.hotbar = h('div', { class: 'hotbar' });
    this.hotSlots = [];
    for (let i = 0; i < 9; i++) {
      const s = h('div', { class: 'slot' }, h('b'));
      s.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();

      });

    }
    this.name = h('div', { class: 'heldname' });
    this.toastEl = h('div', { class: 'toast' });
    this.debugEl = h('pre', { class: 'debug' });
    this.mm = h('div', { class: 'mm' }, this.mmCanvas = h('canvas', { width: String(MM_SIZE), height: String(MM_SIZE), 'aria-label': 'Minimap of nearby players' }), this.mmLabel = h('div', { class: 'mmlabel' }));
    this.mmOn = false; this.mmT = 0; this.mmTxt = '';
    this.hud.append(this.vignette, this.cross, this.mineBar, this.hpBar, this.airBar, this.name, this.hotbar, this.toastEl, this.debugEl, this.mm);
    this.screens = h('div', { class: 'screens' });
    root.append(this.hud, this.screens);
    this.hud.style.display = 'none';
  }

  setAtlas(canvas) { this.atlasUrl = canvas.toDataURL('image/png'); }
  icon(id, size) { const it = getItem(id); return h('div', { class: 'icon', style: tileStyle(this.atlasUrl, it.tile, size) + `;width:${size}px;height:${size}px` }); }

  toast(msg, ms = 2200) {
    this.toastEl.textContent = msg; this.toastEl.classList.add('on');
    clearTimeout(this._tt); this._tt = setTimeout(() => this.toastEl.classList.remove('on'), ms);
  }

  // ---------- screens ----------
  show(name, node) {
    this.screen = name; this.screens.textContent = '';
    if (node) { this.screens.appendChild(node); this.screens.style.display = 'flex'; } else this.screens.style.display = 'none';
    this.hud.style.display = name === 'menu' || name === 'loading' ? 'none' : 'block';
  }
  hideScreens() { this.show(null, null); this.hud.style.display = 'block'; }

  panel(title, ...kids) { return h('div', { class: 'panel' }, h('h1', { text: title }), ...kids); }
  btn(label, fn, cls = '') { return h('button', { class: 'btn ' + cls, text: label, onclick: fn }); }

  showLoading(text, onCancel) { this.show('loading', this.panel('Eagle', h('p', { class: 'dim', text }), onCancel ? this.btn('Cancel', onCancel) : null)); }

  showMainMenu(worlds, error) {
    const list = h('div', { class: 'worlds' });
    if (!worlds.length) list.appendChild(h('p', { class: 'dim', text: 'No worlds yet. Create one below.' }));
    worlds.forEach((w) => list.appendChild(h('div', { class: 'world' },
      h('div', {}, h('strong', { text: w.name }), h('small', { text: ` seed ${w.seed} · played ${new Date(w.lastPlayed).toLocaleDateString()} · ${w.mode === 'creative' ? 'Creative' : 'Survival'}` })),
      h('div', { class: 'row' }, this.btn('Play', () => this.g.playWorld(w), 'primary'),
        this.btn('Delete', () => { if (confirm(`Delete "${w.name}" permanently?`)) this.g.deleteWorld(w.id); }, 'danger')))));
    const name = h('input', { type: 'text', placeholder: 'World name', maxlength: '30', value: 'My World' });
    const seed = h('input', { type: 'text', placeholder: 'Seed (blank = random)', maxlength: '40' });
    const mode = h('select', { 'aria-label': 'Local world mode' },
      h('option', { value: 'survival', text: 'Survival', selected: 'selected' }),
      h('option', { value: 'creative', text: 'Creative' })
    );
    const mpName = h('input', { type: 'text', maxlength: '16', placeholder: 'Your name', value: this.g.mpPrefs().name, 'aria-label': 'Multiplayer player name' });
    const mpBox = h('div', { class: 'mpbox' },
      h('div', {}, h('strong', { text: 'Shared world' }), h('small', { text: 'One persistent world that everyone on this server plays in.' })),
      h('div', { class: 'row mprow' }, mpName, this.btn('Multiplayer', () => this.g.joinMultiplayer({ name: mpName.value }), 'primary')));
    const node = this.panel('Eagle',
      h('p', { class: 'dim', text: 'A voxel survival world that runs in your browser.' }),
      error ? h('p', { class: 'err', text: error }) : null,
      mpBox,
      list,
      h('div', { class: 'create' }, name, seed, mode, this.btn('Create world', () => this.g.createWorld(name.value.trim() || 'My World', seed.value, mode.value), 'primary')),
      h('div', { class: 'row' }, this.btn('Settings', () => this.showSettings('menu')), this.btn('Run benchmark', () => this.g.startBenchmark())));
    this.show('menu', node);
  }

  showPause() {
    this.show('pause', this.panel('Paused',
      this.btn('Resume', () => this.g.resume(), 'primary'),
      this.btn('Settings', () => this.showSettings('pause')),
      this.btn(this.g.mp ? 'Leave shared world' : 'Save & quit to menu', () => this.g.quitToMenu())));
  }

  showDeath() {
    this.show('dead', this.panel('You died', h('p', { class: 'dim', text: 'Your items are safe. Respawn at the world spawn.' }), this.btn('Respawn', () => this.g.respawn(), 'primary')));
  }

  /** Connection failed before joining: explain, and let the player fix the server address and retry. */
  showMpError(message, prefs, onRetry, onBack) {
    const server = h('input', { type: 'text', maxlength: '120', placeholder: 'Server address (blank = the site serving this page)', value: prefs.server || '', 'aria-label': 'Server address' });
    this.show('mp-error', this.panel('Multiplayer',
      h('p', { class: 'err', text: message }),
      h('p', { class: 'dim', text: 'Run  node serve.js  and open the game from that address, or enter another server below.' }),
      server,
      h('div', { class: 'row' }, this.btn('Try again', () => onRetry({ name: prefs.name, server: server.value }), 'primary'), this.btn('Back', onBack))));
  }

  /** Connection dropped mid-session. onRetry is null while automatic reconnection is still running. */
  showMpLost(message, onRetry, onLeave) {
    this.show('mp-lost', this.panel('Connection lost',
      h('p', { class: 'err', text: message }),
      h('p', { class: 'dim', text: 'Your progress is saved on this device. Rejoining reloads the shared world as it is now.' }),
      h('div', { class: 'row' }, onRetry ? this.btn('Reconnect', onRetry, 'primary') : null, this.btn('Leave to menu', onLeave))));
  }

  showSettings(back) {
    const s = this.g.settings, rows = [];
    for (const d of SETTING_DEFS) {
      let input, out = null;
      if (d.type === 'range') {
        out = h('output', { text: d.fmt(s[d.k]) });
        input = h('input', { type: 'range', min: d.min, max: d.max, step: d.step, value: s[d.k] });
        input.addEventListener('input', () => { s[d.k] = +input.value; out.textContent = d.fmt(s[d.k]); this.g.settingsChanged(d.k); });
      } else if (d.type === 'select') {
        input = h('select', {}, d.opts.map(([v, l]) => h('option', { value: v, text: l, ...(s[d.k] === v ? { selected: 'selected' } : {}) })));
        input.addEventListener('change', () => { s[d.k] = input.value; this.g.settingsChanged(d.k); });
      } else {
        input = h('input', { type: 'checkbox', ...(s[d.k] ? { checked: 'checked' } : {}) });
        input.addEventListener('change', () => { s[d.k] = input.checked; this.g.settingsChanged(d.k); });
      }
      rows.push(h('label', { class: 'set' }, h('span', { text: d.label }), h('span', { class: 'ctl' }, input, out)));
    }
    const back_ = this.btn('Back', () => (back === 'pause' ? this.showPause() : this.g.showMenu()), 'primary');
    this.show('settings', this.panel('Settings', h('div', { class: 'setlist' }, rows), back_));
  }

  // ---------- inventory + crafting ----------
  showInventory() {
    this.cursor = null; this.renderInventory();
  }
  /**
   * Inventory sizing. Desktop/tablet keeps the original 48px slots. On phones (narrow or short screens) the slot size is
   * computed so the whole 9-wide grid fits: landscape = grid beside a scrolling recipe list, portrait = one scrolling column.
   */
  invLayout() {
    const w = window.innerWidth || 1024, h = window.innerHeight || 768;
    if (w > 900 && h > 540) return { cell: 48, icon: 40, compact: false, stacked: false };
    const stacked = h > w;
    const cell = stacked ? Math.floor((w - 72) / 9) : Math.min(Math.floor((w - 290) / 9), Math.floor((h - 150) / 5));
    const c = Math.max(30, Math.min(46, cell));
    return { cell: c, icon: Math.round(c * 0.82), compact: true, stacked };
  }

  moveCraftItem(i) {
    const slot = this.craftGrid[i];

    // Each tap moves one ingredient, so a stack can be distributed
    // across the recipe grid without losing the remainder.
    if (!this.cursor) {
      if (!slot) return;
      this.cursor = { id: slot.id, count: 1 };
      slot.count--;
      if (slot.count <= 0) this.craftGrid[i] = null;
    } else if (!slot) {
      this.craftGrid[i] = { id: this.cursor.id, count: 1 };
      this.cursor.count--;
      if (this.cursor.count <= 0) this.cursor = null;
    } else if (slot.id === this.cursor.id) {
      const max = getItem(slot.id).max;
      if (slot.count < max) {
        slot.count++;
        this.cursor.count--;
        if (this.cursor.count <= 0) this.cursor = null;
      }
    } else {
      // Different item: swap stacks so the cursor is never stranded.
      this.craftGrid[i] = this.cursor;
      this.cursor = slot;
    }
    this.renderInventory();
  }

  fillRecipe(recipe) {
    if (recipe.requiresTable && !this.g.craftingTableOpen) {
      this.toast('You need a crafting table for that recipe.');
      return;
    }
    if (this.cursor) {
      this.toast('Place the item you are holding first.');
      return;
    }
    if (this.craftGrid.some(Boolean)) {
      this.toast('Empty the crafting grid before choosing a recipe.');
      return;
    }
    if (!this.g.inv.canCraft(recipe)) {
      this.toast('Missing ingredients');
      return;
    }

    const probe = this.g.inv.clone();
    for (const [id, count] of recipe.inp) {
      if (!probe.remove(id, count)) {
        this.toast('Missing ingredients');
        return;
      }
    }

    const nextGrid = new Array(9).fill(null);
    recipe.pattern.forEach((row, y) => row.forEach((id, x) => {
      if (id) nextGrid[y * 3 + x] = { id, count: 1 };
    }));

    this.g.inv.slots = probe.slots;
    this.craftGrid = nextGrid;
    this.renderInventory();
  }

  craftFromGrid() {
    const recipe = matchGridRecipe(this.craftGrid, !!this.g.craftingTableOpen);
    if (!recipe) {
      this.toast('No matching recipe');
      return;
    }

    // Try the output on a copy first; never consume ingredients if the output won't fit.
    const probe = this.g.inv.clone();
    if (probe.add(recipe.out, recipe.n) > 0) {
      this.toast('Inventory is full');
      return;
    }

    for (let i = 0; i < this.craftGrid.length; i++) {
      const stack = this.craftGrid[i];
      if (!stack) continue;
      stack.count -= 1;
      if (stack.count <= 0) this.craftGrid[i] = null;
    }

    this.g.inv.slots = probe.slots;
    this.g.audio.play('craft');
    this.renderInventory();
  }

  renderInventory() {
    const inv = this.g.inv, L = this.invLayout();
    const craftCell = Math.max(26, Math.min(40, Math.round(L.cell * 0.78)));
    const craftIcon = Math.round(craftCell * 0.78);
    const keep = this.screen === 'inventory' && this.invEls
      ? { body: this.invEls.body.scrollTop, craft: this.invEls.craft.scrollTop }
      : null;

    const grid = h('div', { class: 'grid' });
    const mkSlot = (i) => {
      const st = inv.slots[i];
      const el = h('div', {
        class: 'slot' + (i < 9 ? ' hot' : '') + (i === inv.selected ? ' sel' : '')
      });
      if (st) {
        el.appendChild(this.icon(st.id, L.icon));
        if (st.count > 1) el.appendChild(h('b', { text: st.count }));
        el.title = getItem(st.id).name;
      }
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const stack = inv.slots[i];
        if (stack && (!this.cursor || this.cursor.id === stack.id)) {
          // Tap to pick up or add just one item from a stack.
          if (!this.cursor) this.cursor = { id: stack.id, count: 1 };
          else if (this.cursor.count < getItem(stack.id).max) this.cursor.count++;
          else {
            this.cursor = inv.interact(i, this.cursor);
            this.renderInventory();
            return;
          }
          stack.count--;
          if (stack.count <= 0) inv.slots[i] = null;
        } else {
          this.cursor = inv.interact(i, this.cursor);
        }
        this.renderInventory();
      });
      return el;
    };

    for (let r = 1; r < 4; r++) {
      for (let c = 0; c < 9; c++) grid.appendChild(mkSlot(r * 9 + c));
    }

    const hot = h('div', { class: 'grid hotrow' });
    for (let i = 0; i < 9; i++) hot.appendChild(mkSlot(i));

    const tableCrafting = !!this.g.craftingTableOpen;
    const craftIndices = tableCrafting ? [0,1,2,3,4,5,6,7,8] : [0,1,3,4];
    const craftGrid = h('div', {
      class: 'craftgrid' + (tableCrafting ? '' : ' personal'),
      role: 'group',
      'aria-label': tableCrafting ? '3 by 3 crafting grid' : '2 by 2 personal crafting grid'
    });
    for (const i of craftIndices) {
      const st = this.craftGrid[i];
      const slot = h('div', {
        class: 'slot craftslot',
        role: 'button',
        tabindex: '0',
        'aria-label': `Crafting slot ${i + 1}`
      });
      if (st) {
        slot.appendChild(this.icon(st.id, craftIcon));
        if (st.count > 1) slot.appendChild(h('b', { text: st.count }));
        slot.title = `${getItem(st.id).name} × ${st.count}`;
      }
      const clickSlot = (e) => {
        e.preventDefault();
        this.moveCraftItem(i);
      };
      slot.addEventListener('click', clickSlot);
      slot.addEventListener('keydown', (e) => {
        if (e.code === 'Enter' || e.code === 'Space') clickSlot(e);
      });
      craftGrid.appendChild(slot);
    }

    const result = matchGridRecipe(this.craftGrid, !!this.g.craftingTableOpen);
    const resultSlot = h('div', {
      class: 'slot craftoutput' + (result ? ' ready' : ''),
      role: 'button',
      tabindex: '0',
      'aria-label': result ? `Craft ${getItem(result.out).name}` : 'Crafting result',
      title: result ? `Craft ${getItem(result.out).name}` : 'No recipe'
    });
    if (result) {
      resultSlot.appendChild(this.icon(result.out, craftIcon));
      if (result.n > 1) resultSlot.appendChild(h('b', { text: result.n }));
    }
    const craftResult = (e) => {
      if (e) e.preventDefault();
      this.craftFromGrid();
    };
    resultSlot.addEventListener('click', craftResult);
    resultSlot.addEventListener('keydown', (e) => {
      if (e.code === 'Enter' || e.code === 'Space') craftResult(e);
    });

    const recipes = h('div', {
      class: 'recipes',
      style: this.recipeBookOpen ? '' : 'display:none'
    });
    for (const r of GRID_RECIPES.filter((r) => tableCrafting || !r.requiresTable)) {
      const ok = inv.canCraft(r), it = getItem(r.out);
      const need = r.inp.map(([id, n]) => `${n} ${getItem(id).name}`).join(', ');
      recipes.appendChild(h('button', {
        class: 'recipe' + (ok ? '' : ' no'),
        onclick: () => this.fillRecipe(r),
        title: `Move ingredients into the grid: ${need}`
      },
        this.icon(r.out, 36),
        h('span', {},
          h('strong', { text: `${it.name}${r.n > 1 ? ' ×' + r.n : ''}` }),
          h('small', { text: need })
        )
      ));
    }

    const cur = this.cursor
      ? h('p', { class: 'dim', text: `Holding ${this.cursor.count} × ${getItem(this.cursor.id).name} — tap a slot to place it.` })
      : this.craftGrid.some(Boolean)
        ? h('p', { class: 'dim', text: 'Tap ingredients to move them. Tap the result to craft.' })
        : h('p', { class: 'dim', text: 'Tap a stack, then a slot to move it. Choose a recipe or place items in the 3×3 grid.' });

    const toggle = h('button', {
      class: 'btn crafttoggle',
      text: this.recipeBookOpen ? 'Hide recipes' : 'Recipe book',
      onclick: () => {
        this.recipeBookOpen = !this.recipeBookOpen;
        this.renderInventory();
      }
    });
    const craftHead = h('div', { class: 'crafthead' },
      h('h2', { text: tableCrafting ? 'Crafting Table' : 'Crafting' }), toggle
    );
    const craftArea = h('div', { class: 'craftarea' },
      craftGrid,
      h('span', { class: 'craftarrow', text: '→', 'aria-hidden': 'true' }),
      h('div', { class: 'craftresult' },
        h('small', { class: 'craftlabel', text: 'Result' }),
        resultSlot
      )
    );

    const body = h('div', { class: 'invbody' },
      h('div', { class: 'invcol' }, grid, hot),
      h('div', { class: 'craftcol' }, craftHead, craftArea, recipes)
    );
    const close = h('button', {
      class: 'btn xbtn', text: '✕', onclick: () => this.g.closeInventory()
    });
    close.setAttribute('aria-label', 'Close inventory');

    const panel = h('div', {
      class: 'panel inv' + (L.compact ? ' compact' : '') + (L.stacked ? ' stacked' : ''),
      style: `--cell:${L.cell}px;--craftcell:${craftCell}px`
    },
      h('div', { class: 'invhead' }, h('h1', { text: 'Inventory' }), close),
      cur, body,
      this.btn('Close', () => this.g.closeInventory(), 'primary desk')
    );

    this.show('inventory', panel);
    this.screen = 'inventory';
    this.invEls = { body, craft: recipes };
    if (keep) {
      body.scrollTop = keep.body;
      recipes.scrollTop = keep.craft;
    }
  }

  // ---------- HUD ----------
  slotInner(el, st) {
    const key = st ? st.id + ':' + st.count : '';
    if (el._k === key) return;
    el._k = key;
    el.textContent = '';
    if (st) { el.appendChild(this.icon(st.id, 36)); if (st.count > 1) el.appendChild(h('b', { text: st.count })); }
  }
  updateHud(g, breakProgress) {
    const inv = g.inv, p = g.player;
    for (let i = 0; i < 9; i++) { this.slotInner(this.hotSlots[i], inv.slots[i]); this.hotSlots[i].classList.toggle('sel', i === inv.selected); }
    const hp = Math.round(p.health * 5) / 5;
    if (this.cache.hp !== hp) { this.cache.hp = hp; this.hpFill.style.width = (hp / p.maxHealth) * 100 + '%'; this.hpText.textContent = Math.ceil(hp) + ' / ' + p.maxHealth; }
    const air = p.headInWater ? Math.round(p.air * 10) : -1;
    if (this.cache.air !== air) { this.cache.air = air; this.airBar.style.display = air >= 0 ? 'block' : 'none'; this.airFill.style.width = Math.max(0, air) + '%'; }
    const bp = Math.round(breakProgress * 50);
    if (this.cache.bp !== bp) { this.cache.bp = bp; this.mineBar.style.display = bp > 0 ? 'block' : 'none'; this.mineFill.style.width = bp * 2 + '%'; }
    const fl = Math.round(p.hurtFlash * 10);
    if (this.cache.fl !== fl) { this.cache.fl = fl; this.vignette.style.opacity = fl / 5; }
    const held = inv.held(), nm = held ? getItem(held).name : '';
    if (this.cache.nm !== nm) { this.cache.nm = nm; this.name.textContent = nm; }
  }
  // ---------- minimap (multiplayer only) ----------
  setMultiplayerHud(on) { this.mmOn = !!on; this.mmTxt = ''; this.hud.classList.toggle('mp', !!on); }

  /** North-up radar centred on you: amber arrow = you, blue arrows = other players (all show their facing). */
  updateMinimap(g) {
    if (!this.mmOn || !g.mp) return;
    const now = performance.now();
    if (now - this.mmT < 100) return;
    this.mmT = now;
    const mp = g.mp, p = g.player, S = MM_SIZE, c = S / 2, k = (c - 8) / MM_RANGE, dpr = Math.min(2, window.devicePixelRatio || 1);
    const cv = this.mmCanvas;
    if (cv.width !== Math.round(S * dpr)) { cv.width = cv.height = Math.round(S * dpr); }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    ctx.strokeStyle = 'rgba(66,86,107,.75)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const r of [MM_RANGE * k, MM_RANGE * k * 0.5]) { ctx.moveTo(c + r, c); ctx.arc(c, c, r, 0, Math.PI * 2); }
    ctx.moveTo(c, 3); ctx.lineTo(c, S - 3); ctx.moveTo(3, c); ctx.lineTo(S - 3, c);
    ctx.stroke();
    ctx.fillStyle = '#98a8b8'; ctx.font = 'bold 9px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('N', c, 2);
    const arrow = (x, y, yaw, size, fill, alpha) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(-Math.cos(yaw), -Math.sin(yaw)));   // facing = (-sin yaw, -cos yaw), same as the player
      ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * 0.7, -size * 0.75); ctx.lineTo(-size * 0.35, 0); ctx.lineTo(-size * 0.7, size * 0.75); ctx.closePath();
      ctx.stroke(); ctx.fill(); ctx.restore();
    };
    for (const r of mp.players.values()) {
      const dx = r.x - p.x, dz = r.z - p.z, d = Math.hypot(dx, dz);
      if (d <= MM_RANGE) arrow(c + dx * k, c + dz * k, r.yaw, 5.5, '#6ab7ee', 1);
      else arrow(c + (dx / d) * MM_RANGE * k, c + (dz / d) * MM_RANGE * k, r.yaw, 4, '#6ab7ee', 0.5);   // out of range: pinned to the edge
    }
    arrow(c, c, p.yaw, 6, '#e8a932', 1);
    const n = mp.players.size + 1, txt = mp.online ? `${n} online` : 'offline';
    if (txt !== this.mmTxt) {
      this.mmTxt = txt; this.mmLabel.textContent = '';
      this.mmLabel.appendChild(h('i', { text: '● ' })); this.mmLabel.appendChild(document.createTextNode(txt));
      this.mmLabel.className = 'mmlabel' + (mp.online ? '' : ' off');
    }
  }

  setDebug(text) { if (text === null) { this.debugEl.style.display = 'none'; return; } this.debugEl.style.display = 'block'; this.debugEl.textContent = text; }
}
